name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FileMover.slnx

      - name: Build (warnings as errors)
        run: dotnet build FileMover.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution FileMover.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list FileMover.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/coverage.cobertura.xml'
